logging:
  level:
    com.market.analytics: DEBUG

spring:
  codec:
    max-in-memory-size: 10MB
  datasource:
    diver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/market-analytics?forceBinary=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: ALWAYS

market-analytics:
  blockVolume:
    dataSourcePath: "D:/development/DataStorage/sourceData"
    dataStoragePath: "D:/development/DataStorage/structuredData"
  batchConfig:
    mirroringChunkSize: 1000
    dataRetentionLapse: 150
  apis:
    bulkData:
      queryParams:
        adjusted: true
        includeOtc: true
        limit: 1000
        apiKey: ${MASSIVE_API_KEY}
      baseUrl: "api.polygon.io"
      stocksDaily: "/v2/aggs/grouped/locale/us/market/stocks/{previousDay}"
      forexDaily: "/v2/aggs/grouped/locale/global/market/fx/{previousDay}"
      cryptoDaily: "/v2/aggs/grouped/locale/global/market/crypto/{previousDay}"
      tickerOverview: "/v3/reference/tickers/{ticker}"
      allTickers: "/v3/reference/tickers"
      delay: 15


databases:
  datasource:
    dataHistory:
      diver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://localhost:5432/market-analytics
      password: ${DB_PASSWORD}
      username: ${DB_USERNAME}